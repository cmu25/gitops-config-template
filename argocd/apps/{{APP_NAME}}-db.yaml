apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{APP_NAME}}-db
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/{{OWNER}}/{{APP_NAME}}-config
    targetRevision: main
    path: k8s/db
  destination:
    server: https://kubernetes.default.svc
    namespace: {{APP_NAME}}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true